# One command: docker compose up --build
# api    -> seeds the sample post (safe to repeat), then serves http://localhost:3000
# worker -> publishes due slots. Stop/start it on its own to test crash recovery:
#           docker compose stop worker   /   docker compose start worker
services:
  api:
    build: .
    command: sh -c "npm run seed && node src/server.js"
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_FILE: /app/data/studio.db
    volumes:
      - studio-data:/app/data

  worker:
    build: .
    command: node src/worker.js
    depends_on:
      - api
    env_file:
      - path: .env
        required: false
    environment:
      DB_FILE: /app/data/studio.db
    volumes:
      - studio-data:/app/data
    stop_grace_period: 30s

volumes:
  studio-data:
